# electron-builder 配置。阶段 4 本地打包验证时定稿；此处为完整版。
appId: io.github.haoyueqin.deepseek-harness-desktop
productName: DeepSeek Harness Desktop
copyright: MIT

directories:
  output: release
  buildResources: build

# 只打包 en-US + zh-CN 语言包（省 ~40M）
electronLanguages: [en-US, zh-CN]

# 自动更新元数据发布源（electron-updater 读取；releases/latest 重定向到最新 tag）
publish:
  provider: generic
  url: https://github.com/HaoyueQin/deepseek-harness-desktop/releases/latest/download

# 主进程代码（tsc 产物）+ package.json 进 asar；dsh 运行时/Node 发行版走 extraResources
files:
  - dist/**/*
  - package.json

# dsh 依赖树与 Node 运行时不进 asar：
# dsh 使用 createRequire/worker_threads/动态 import，asar 内文件 spawn 受限。
# resources/ 布局（保持双层）：dsh/（node_modules + bin.js）、runtime/（Node 发行版）、
# icon.png、desktop-integration/、desktop-patch.yml。
# 注意：不能把 dsh 平铺到 resources/dsh 顶层——electron-builder 26 的
# createFilter 硬编码排除顶层 node_modules（util/Filter.js:43），平铺后 dsh 依赖树
# 会整体丢失。路径缩短靠 NSIS 自定义 installDir（-20 字符）+ 构建期清理/嵌套去重实现。
extraResources:
  - from: resources
    to: resources

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # 无空格安装包名：GitHub Release 上传会把文件名里的空格替换成点号，导致
  # latest.yml 的 path 与实际资产名不一致，electron-updater 下载 404。
  # 用无空格 artifactName 保证 latest.yml path 与资产名一致。
  artifactName: ${name}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DeepSeek Harness Desktop
  # 安装/更新时自动强杀运行中的应用（托盘常驻，默认"请手动关闭"会卡死）
  include: build/installer-close-app.nsh

mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.developer-tools
  # 无开发者证书：出未签名包，用户首次需右键打开
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Development
  maintainer: HaoyueQin <278892763+HaoyueQin@users.noreply.github.com>
  # 按 target 区分扩展名：AppImage 固定名（更新替换稳定）、deb 正常名。
  # 之前写死 .AppImage 后缀导致 deb 也被命名为 .AppImage，release/*.deb 匹配不到未上传。
  artifactName: ${name}-${version}.${ext}
