name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 三平台 matrix：每 job 在对应 runner 上生成图标（install-runtime）并
# electron-builder 出包，产物挂 GitHub Release。纯壳架构：dsh 运行时不在包内，
# 运行时 spawn 用户全局安装的 dsh CLI（见 src/dsh-locator.ts）。
# npm registry 用 npmmirror（国内网络）；electron-builder 的组件下载用镜像。
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node-arch: win-x64
            eb-arch: x64
          # macos-13（Intel runner）已从公共仓库退役；macOS 两个架构都由
          # macos-14（arm64）构建：arm64 原生 + x64 交叉构建
          - os: macos-14
            node-arch: darwin-arm64
            eb-arch: arm64
          - os: macos-14
            node-arch: darwin-x64
            eb-arch: x64
          - os: ubuntu-latest
            node-arch: linux-x64
            eb-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 图标源：dsh 官方仓库的 favicon.svg（安装包/托盘/窗口图标）
      # shell: bash —— Windows runner 默认 PowerShell，反斜杠续行会破坏 URL
      - name: Fetch favicon source
        shell: bash
        run: |
          mkdir -p build
          curl -sSL -o build/favicon-source.svg \
            https://raw.githubusercontent.com/deepseek-ai/deepseek-harness/master/apps/web/public/favicon.svg

      # 不用 npm ci / package-lock：dsh 版本由 package.json 的范围声明
      # （^0.1.0-rc.8）跟随上游最新，lock 会把构建钉死在旧版。
      - name: Install build deps
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      # 纯壳架构：dsh 运行时不内置；smoke 用 runner 上全局安装的 dsh
      - name: Install dsh CLI (for smoke)
        run: npm i -g @deepseek-ai/dsh

      - name: Install icon
        run: npm run build:runtime
        env:
          DSH_ICON_SVG: ${{ github.workspace }}/build/favicon-source.svg

      - name: Build app (tsc)
        run: npm run build

      # 无 GUI 冒烟：验证 dsh web 启动与端口发现链路（Linux CI 无显示服务器，
      # 跳过 GUI 验证；web 进程无需 X）
      - name: Smoke test (headless)
        run: node scripts/smoke.mjs

      - name: Package (electron-builder)
        run: npx electron-builder --publish never --${{ matrix.eb-arch }}
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}-${{ matrix.node-arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
